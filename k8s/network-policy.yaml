apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: codemender-sandbox-egress-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      sandbox-type: codemender-runtime
  policyTypes:
  - Egress
  egress:
  # 1. Allow DNS resolution (CoreDNS/kube-dns and NodeLocal DNSCache)
  - to:
    - namespaceSelector: {}
    - ipBlock:
        cidr: 169.254.20.10/32
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53

  # 2. Allow Private Google Access Ranges and PSC Endpoints (Vertex AI / GCP APIs / GCS)
  - to:
    - ipBlock:
        cidr: 199.36.153.8/30 # restricted.googleapis.com
    - ipBlock:
        cidr: 199.36.153.4/30 # private.googleapis.com
    - ipBlock:
        cidr: 10.129.0.50/32 # PSC Endpoint for Google APIs
    ports:
    - protocol: TCP
      port: 443

  # 3. Allow access to GKE Metadata Server for Workload Identity
  - to:
    - ipBlock:
        cidr: 169.254.169.254/32
    ports:
    - protocol: TCP
      port: 80

